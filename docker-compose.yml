services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7

  backend:
    build: ./backend/EcommerceApi
    image: ${DOCKERHUB_USER}/ecommerce-backend:1.0
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=EcommerceDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Redis__Connection: redis:6379
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: EcommerceApi
      Jwt__Audience: EcommerceClient
      Razorpay__KeyId: ${RAZORPAY_KEY_ID}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET}

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USER}/ecommerce-frontend:1.0
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  sqldata: